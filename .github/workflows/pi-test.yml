name: PI Runtime Test

on:
  workflow_run:
    workflows: ["PI Chat Worker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: pi-runtime-test
  cancel-in-progress: false

env:
  PI_PUBLIC_URL: https://pisolutions9.github.io/Pisolutions9
  PI_CHAT_URL: https://pi-chat.premchandyadlapati.workers.dev/api/chat

jobs:
  test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full regression gate
        run: npm test
      - name: Live production customer HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing customer site: $PI_PUBLIC_URL"
          site_status="$(curl --silent --show-error --location --max-time 20 --retry 3 --retry-all-errors --output /tmp/pi-site.html --write-out '%{http_code}' "$PI_PUBLIC_URL/")"
          echo "Customer site HTTP status: $site_status"
          test "$site_status" -ge 200
          test "$site_status" -lt 300
          grep -Fq 'app.js?v=20260919-browser-continuity' /tmp/pi-site.html
          grep -Fq 'How can I help?' /tmp/pi-site.html
          grep -Fq 'Ask me anything…' /tmp/pi-site.html
          grep -Fq 'BIG IDEAS. REAL RESULTS.' /tmp/pi-site.html

          answers=()
          questions=(
            'What is 2 plus 2?'
            'Why is the sky blue?'
            'Say hello in one short sentence.'
            'Tell me something cool.'
            'What is the difference between RAM and storage?'
            'Explain opportunity cost in simple terms.'
            'Build me a website for launching my own products like Amazon.'
            'You are given a company with $2M annual revenue, 35% gross margin, 18% churn, and $300k cash. Design a 12-month plan to reach $5M revenue while preserving cash runway. State assumptions, calculate key metrics, identify risks, and give a prioritized execution sequence.'
            'Explain quantum computing to a software engineer. Compare it with classical computing, give one concrete example where it could matter, and clearly separate what is practical today from what is still experimental.'
            'I want to launch a niche marketplace like Amazon. Design the MVP architecture, database entities, APIs, payment flow, seller onboarding, search, security controls, testing strategy, and phased launch plan for a small team.'
            'A country wants to reduce semiconductor import dependence by 30% in five years. Build a neutral analytical framework covering supply chain, capital, talent, technology, tradeoffs, measurable milestones, and key uncertainties. Do not assume any particular policy is best.'
          )
          complex_questions=4
          for index in "${!questions[@]}"; do
            question="${questions[$index]}"
            status="$(curl --silent --show-error --location --max-time 20 --retry 2 --retry-all-errors \
              -H 'content-type: application/json' \
              -H 'origin: https://pisolutions9.github.io' \
              -d "$(python -c 'import json,sys; print(json.dumps({"message":sys.argv[1]}))' "$question")" \
              --output /tmp/pi-chat.json --write-out '%{http_code}' "$PI_CHAT_URL")"
            echo "Chat HTTP status: $status | input: $question"
            cat /tmp/pi-chat.json
            python -c 'import json,sys; status=int(sys.argv[1]); d=json.load(open("/tmp/pi-chat.json")); answer=d.get("answer"); assert isinstance(answer,str) and answer.strip(); safe_refusal=(status==503 and d.get("ok") is False and d.get("status")=="verification_failed" and d.get("error")=="hard_reasoning_not_verified" and d.get("truth")=="unknown"); success=(status==200 and d.get("ok") is True); assert success or safe_refusal, f"unexpected contract: HTTP {status} {d}"; a=answer.lower().lstrip(); forbidden_prefixes=("classification: business_objective","classification: informational","classification:"); forbidden_phrases=("i recognized this as an informational question","i will answer directly when the required knowledge is available.","temporarily operating in verified recovery mode"); assert not a.startswith(forbidden_prefixes) and not any(x in a for x in forbidden_phrases); print("SAFE_REFUSAL" if safe_refusal else "ANSWER_LENGTH", "" if safe_refusal else len(answer)); print("ANSWER", answer)' "$status"
            answers+=("$(python -c 'import json; print(json.load(open("/tmp/pi-chat.json"))["answer"])')")
            if [ "$index" -ge 7 ]; then
              python -c 'import json,sys; status=int(sys.argv[1]); d=json.load(open("/tmp/pi-chat.json")); a=d.get("answer","").strip(); assert status==200 and d.get("ok") is True, f"complex readiness requires a successful answer, got HTTP {status}: {d}"; assert d.get("truth") in ("verified-model-response","model-response"), f"complex readiness rejects provisional/degraded truth: {d.get("truth")}"; assert d.get("truth") != "provisional-model-response"; assert len(a)>=160, f"complex answer too short: {len(a)}"' "$status"
            fi
          done
          test "${#answers[@]}" = 11
          for ((i=0; i<${#answers[@]}; i++)); do test -n "${answers[$i]}"; done
          echo "Complex customer-input stress test passed for $complex_questions multi-part questions with no provisional/degraded responses."
