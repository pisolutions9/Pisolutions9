name: PI V1 Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

env:
  PI_CHAT_URL: https://pi-chat.premchandyadlapati.workers.dev/api/chat
  STRESS_ROUNDS: ${{ github.event_name == 'schedule' && '100' || '3' }}

jobs:
  stress-customer-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full regression gate
        run: npm test
      - name: Deploy chat worker before V1 stress validation
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-save --no-package-lock wrangler@4
          node src/deterministic-fallback-test.mjs
          npx wrangler deploy
      - name: Stress customer interface with complex questions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          questions = [
            "Design a scalable marketplace architecture for 10 million users. Explain the data model, API boundaries, caching, search, payments, inventory consistency, observability, security, and how you would evolve an MVP without creating a monolith.",
            "A company has $2 million cash, $600k monthly burn, and expects revenue to grow from $100k to $250k per month over six months. Build three runway scenarios and explain the assumptions and break-even conditions.",
            "Explain why quantum computers do not simply replace classical computers. Compare qubits, superposition, entanglement, error correction, and practical workloads, then identify what would have to improve for useful large-scale quantum advantage.",
            "An e-commerce service has p95 latency of 900ms, 2% checkout failures, and periodic inventory overselling. Diagnose likely causes and propose a prioritized remediation plan with measurable acceptance tests.",
            "Design a supply-chain strategy for a semiconductor company exposed to a single overseas supplier. Cover dual sourcing, qualification time, inventory buffers, geopolitical risk, cost tradeoffs, and a 12-month implementation sequence.",
            "Teach a beginner how to evaluate whether a machine-learning model is actually improving a business process. Include baseline selection, leakage, train/test design, metrics, confidence intervals, monitoring, and examples of misleading improvements.",
            "Create a product launch plan for a new software platform with a $100k budget. Allocate engineering, security, infrastructure, marketing, support, analytics, and contingency while explaining what should be validated before spending heavily.",
            "A database migration must move 20 TB with near-zero downtime. Compare dual writes, CDC, replication, phased cutover, rollback strategy, validation, and failure handling. Give a concrete migration sequence.",
            "Explain how inflation, interest rates, unemployment, productivity, fiscal policy, and consumer demand interact. Use a hypothetical economy to show why the same policy can have different effects under different conditions.",
            "Review this logic: if a system is highly available, it must also be highly reliable; if it is highly reliable, it must be secure; therefore highly available systems are necessarily secure. Identify the invalid inference and construct a better framework.",
            "Design an autonomous AI workflow that receives an objective, decomposes it into tasks, uses specialist agents, verifies evidence, detects failures, retries with a changed strategy, and stops at human approval boundaries. Explain state, observability, safety, and evaluation requirements.",
            "A startup has strong user growth but negative unit economics. Explain how to separate growth quality from vanity metrics using CAC, LTV, contribution margin, retention cohorts, payback period, and sensitivity analysis."
          ]
          with open('/tmp/questions.json','w') as f: json.dump(questions,f)
          PY

          python - <<'PY'
          import json, subprocess, time, concurrent.futures, os
          url=os.environ['PI_CHAT_URL']
          questions=json.load(open('/tmp/questions.json'))
          rounds=int(os.environ['STRESS_ROUNDS'])
          cases=questions*rounds
          print(f"Running {len(cases)} customer questions ({rounds} rounds x {len(questions)} complex prompts; {'deep soak' if rounds >= 100 else 'release sample'})")

          # Reject the old internal-routing response contract without rejecting
          # ordinary customer answers that legitimately contain headings such as
          # "Remediation Plan:" or "Launch Plan:".
          legacy_markers=(
              'classification:',
              'i recognized this as an informational question',
              'temporarily operating in verified recovery mode',
              'live model execution is currently unavailable'
          )

          def valid_answer(status, data):
              answer=data.get('answer','') if isinstance(data,dict) else ''
              low=answer.lower() if isinstance(answer,str) else ''
              return (
                  status == '200'
                  and isinstance(data,dict)
                  and data.get('ok') is True
                  and data.get('truth') == 'model-response'
                  and data.get('source','').startswith(('pi-chat-cloudflare-ai:', 'pi-chat-openai:', 'pi-chat-fallback'))
                  and isinstance(answer,str)
                  and len(answer.strip()) >= 120
                  and not low.lstrip().startswith('classification:')
                  and not any(marker in low for marker in legacy_markers[1:])
              )

          def safe_refusal(status, data):
              return (
                  status == '503'
                  and isinstance(data,dict)
                  and data.get('ok') is False
                  and data.get('status') == 'verification_failed'
                  and data.get('error') == 'hard_reasoning_not_verified'
                  and data.get('truth') == 'unknown'
                  and isinstance(data.get('answer'),str)
                  and bool(data['answer'].strip())
              )

          valid_fixture={'ok':True,'truth':'model-response','source':'pi-chat-cloudflare-ai:test','answer':'Prioritized Remediation Plan: ' + ('verified customer guidance ' * 8)}
          refusal_fixture={'ok':False,'status':'verification_failed','error':'hard_reasoning_not_verified','truth':'unknown','answer':'I could not independently verify this high-depth answer, so I will not present an unverified result as reliable.'}
          legacy_fixture={'ok':True,'truth':'model-response','source':'pi-chat-cloudflare-ai:test','answer':'Classification: BUSINESS_OBJECTIVE\n\nPlan:\n' + ('internal routing output ' * 8)}
          if not valid_answer('200',valid_fixture) or not safe_refusal('503',refusal_fixture) or valid_answer('200',legacy_fixture):
              raise SystemExit('customer answer contract regression')

          def ask(q):
              payload=json.dumps({'message':q})
              t=time.time()
              p=subprocess.run(['curl','--silent','--show-error','--connect-timeout','5','--max-time','22','-H','content-type: application/json','-H','origin: https://pisolutions9.github.io','-d',payload,'-w','\n%{http_code}',url],capture_output=True,text=True)
              elapsed=time.time()-t
              if p.returncode != 0: return False, elapsed, {'transport': f'curl:{p.returncode}', 'stderr': p.stderr[-240:]}
              if '\\n' not in p.stdout: return False, elapsed, {'transport':'missing-http-status','prefix':p.stdout[:120]}
              body,status=p.stdout.rsplit('\n',1)
              try: d=json.loads(body)
              except Exception: return False, elapsed, {'transport':'invalid-json','http':status,'body_prefix':body[:240]}
              ans=d.get('answer','') if isinstance(d,dict) else ''
              ok=valid_answer(status,d) or safe_refusal(status,d)
              return ok, elapsed, {'http': status, 'ok': (d.get('ok') if isinstance(d,dict) else None), 'status': (d.get('status') if isinstance(d,dict) else None), 'length': (len(ans) if isinstance(ans,str) else 0), 'truth': (d.get('truth') if isinstance(d,dict) else None), 'source': (d.get('source') if isinstance(d,dict) else None), 'prefix': (ans[:120] if isinstance(ans,str) else '')}

          failures=[]
          latencies=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              futs=[ex.submit(ask,q) for q in cases]
              for i,f in enumerate(concurrent.futures.as_completed(futs),1):
                  ok,lat,detail=f.result(); latencies.append(lat)
                  if not ok: failures.append((i,detail))
                  if i%100==0: print(f'completed={i} failures={len(failures)}')

          latencies.sort()
          print(f'total={len(cases)} failures={len(failures)} p50={latencies[len(latencies)//2]:.2f}s p95={latencies[int(len(latencies)*.95)-1]:.2f}s max={max(latencies):.2f}s')
          if failures:
              print('first failures:', failures[:20])
              raise SystemExit(1)
          PY
