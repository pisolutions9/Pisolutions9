name: PI Owner Readiness Round 3

on:
  push:
    branches: [main]
    paths:
      - 'pi/owner-style-live-test-round3.mjs'
      - '.github/workflows/pi-owner-readiness-round3.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PI_CHAT_URL: https://pi-chat.premchandyadlapati.workers.dev/api/chat

jobs:
  round3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run fresh harder 10-question production test
        run: node pi/owner-style-live-test-round3.mjs
