name: PI Level 2 Transactional Queue Gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pi/level2/**'
      - '.github/workflows/pi-level2-sqlite.yml'
permissions:
  contents: read
jobs:
  sqlite-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run transactional queue adversarial tests
        run: python3 pi/level2/queue-sqlite-test.py
      - name: Run existing Level 2 mock orchestration tests
        run: node pi/level2/orchestrator-test.mjs
      - name: Run mock end-to-end experiment
        run: python3 pi/level2/experiment-test.py
      - name: Run structured handoff adversarial tests
        run: python3 pi/level2/handoff-test.py
      - name: Run signed verifier boundary adversarial tests
        timeout-minutes: 8
        run: python3 pi/level2/verifier-boundary-test.py
      - name: Run disabled provider adapter tests
        run: python3 pi/level2/providers-test.py
      - name: Run subscription proof offline safety tests
        run: python3 pi/level2/subscription-test.py


