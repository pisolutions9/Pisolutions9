name: PI V1.02 Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-v102-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  v102:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: V1.02 trust and governor tests
        run: npm run test:v1.02
      - name: Full regression suite
        run: npm test
