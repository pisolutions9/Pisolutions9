name: PI V1.02 Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-v102-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  v102:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: V1.02 trust and governor tests
        run: npm run test:v1.02
      - name: Full regression suite
        run: npm test
      - name: Install live browser harness
        if: github.event_name != 'pull_request'
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Live browser end-to-end customer test
        if: github.event_name != 'pull_request'
        run: npx playwright test pi/live-browser-e2e.spec.mjs --reporter=line --workers=1
