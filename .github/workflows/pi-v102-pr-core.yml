name: PI V1.02 PR Core

on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - 'package.json'
      - '.github/workflows/pi-v102-pr-core.yml'

permissions:
  contents: read

jobs:
  v102-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run V1.02 core regression suite
        run: npm run test:v1.02
