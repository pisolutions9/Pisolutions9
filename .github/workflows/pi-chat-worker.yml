name: PI Chat Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'pi/customer-response.mjs'
      - '.github/workflows/pi-chat-worker.yml'

permissions:
  contents: read
  issues: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      PI_FALLBACK_API_KEY: ${{ secrets.PI_FALLBACK_API_KEY }}
      PI_FALLBACK_API_URL: ${{ secrets.PI_FALLBACK_API_URL }}
      PI_FALLBACK_MODEL: ${{ secrets.PI_FALLBACK_MODEL }}
      PI_FALLBACK_API_STYLE: ${{ secrets.PI_FALLBACK_API_STYLE }}
      PI_OWNER_TOKEN: ${{ secrets.PI_OWNER_TOKEN }}
      PI_STRIPE_SECRET_KEY: ${{ secrets.PI_STRIPE_SECRET_KEY }}
      PI_STRIPE_WEBHOOK_SECRET: ${{ secrets.PI_STRIPE_WEBHOOK_SECRET }}
      PI_STRIPE_PRICE_ID: ${{ secrets.PI_STRIPE_PRICE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install current Wrangler
        working-directory: worker
        run: npm install --no-save --no-package-lock wrangler@4.138.0
      - name: Test deterministic recovery
        working-directory: worker
        run: |
          node src/deterministic-fallback-test.mjs
          node scripts/verify-provider-configuration-test.mjs
      - name: Deploy PI chat worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Configure optional OpenAI fallback
        if: ${{ env.OPENAI_API_KEY != '' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
          echo 'OpenAI fallback secret configured on the production Worker.'
      - name: Configure optional Groq fallback
        if: ${{ env.GROQ_API_KEY != '' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY
          echo 'Groq fallback secret configured on the production Worker.'

      - name: Configure optional OpenRouter fallback
        if: ${{ env.OPENROUTER_API_KEY != '' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY
          echo 'OpenRouter free-router fallback secret configured on the production Worker.'

      - name: Configure optional SerpApi shopping search
        if: ${{ env.SERPAPI_API_KEY != '' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SERPAPI_API_KEY" | npx wrangler secret put SERPAPI_API_KEY
          echo 'SerpApi shopping/search secret configured on the production Worker.'

      - name: Configure optional independent fallback provider
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          present=0
          [[ -n "${PI_FALLBACK_API_KEY:-}" ]] && present=$((present + 1))
          [[ -n "${PI_FALLBACK_API_URL:-}" ]] && present=$((present + 1))
          [[ -n "${PI_FALLBACK_MODEL:-}" ]] && present=$((present + 1))
          if [[ "$present" = 0 ]]; then
            echo 'No independent third provider configured; Cloudflare + OpenAI remain the available live vendors.'
          elif [[ "$present" != 3 ]]; then
            echo 'Independent fallback provider configuration is partial; refusing an unsafe deployment.'
            exit 1
          else
            printf '%s' "$PI_FALLBACK_API_KEY" | npx wrangler secret put PI_FALLBACK_API_KEY
            printf '%s' "$PI_FALLBACK_API_URL" | npx wrangler secret put PI_FALLBACK_API_URL
            printf '%s' "$PI_FALLBACK_MODEL" | npx wrangler secret put PI_FALLBACK_MODEL
            if [[ -n "${PI_FALLBACK_API_STYLE:-}" ]]; then
              printf '%s' "$PI_FALLBACK_API_STYLE" | npx wrangler secret put PI_FALLBACK_API_STYLE
            fi
            echo 'Independent fallback provider configured on the production Worker.'
          fi

      - name: Configure optional owner authentication
        if: ${{ env.PI_OWNER_TOKEN != '' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PI_OWNER_TOKEN" | npx wrangler secret put PI_OWNER_TOKEN
          echo 'Owner authentication secret configured on the production Worker.'

      - name: Configure optional Stripe billing
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          present=0
          [[ -n "${PI_STRIPE_SECRET_KEY:-}" ]] && present=$((present + 1))
          [[ -n "${PI_STRIPE_WEBHOOK_SECRET:-}" ]] && present=$((present + 1))
          [[ -n "${PI_STRIPE_PRICE_ID:-}" ]] && present=$((present + 1))
          if [[ "$present" = 0 ]]; then
            echo 'Stripe billing remains disabled.'
          elif [[ "$present" != 3 ]]; then
            echo 'Partial Stripe billing configuration detected; refusing unsafe deployment.'
            exit 1
          else
            case "$PI_STRIPE_SECRET_KEY" in
              sk_test_*|rk_test_*) expected_livemode=false; billing_mode=test ;;
              sk_live_*|rk_live_*) expected_livemode=true; billing_mode=live ;;
              *) echo 'Stripe API key must be an sk_test_, sk_live_, rk_test_, or rk_live_ key.' >&2; exit 1 ;;
            esac
            [[ "$PI_STRIPE_WEBHOOK_SECRET" == whsec_* ]] || { echo 'Stripe webhook secret must start with whsec_.' >&2; exit 1; }
            [[ "$PI_STRIPE_PRICE_ID" == price_* ]] || { echo 'Stripe price ID must start with price_.' >&2; exit 1; }

            price_json="$(curl --silent --show-error --fail-with-body --max-time 20 \
              -H "Authorization: Bearer $PI_STRIPE_SECRET_KEY" \
              "https://api.stripe.com/v1/prices/$PI_STRIPE_PRICE_ID")"
            python -c 'import json,sys; d=json.loads(sys.argv[1]); expected=sys.argv[2]=="true"; assert d.get("object")=="price", "Stripe object is not a Price"; assert d.get("active") is True, "Stripe Price is not active"; assert d.get("livemode") is expected, "Stripe Price livemode mismatch"; assert d.get("type")=="recurring", "Stripe Price must be recurring for PI subscription billing"' "$price_json" "$expected_livemode"
            printf '%s' "$PI_STRIPE_SECRET_KEY" | npx wrangler secret put PI_STRIPE_SECRET_KEY
            printf '%s' "$PI_STRIPE_WEBHOOK_SECRET" | npx wrangler secret put PI_STRIPE_WEBHOOK_SECRET
            printf '%s' "$PI_STRIPE_PRICE_ID" | npx wrangler secret put PI_STRIPE_PRICE_ID
            echo "Stripe $billing_mode billing secrets validated and configured on the production Worker."
          fi

      - name: Verify release provider configuration
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Cloudflare-managed secrets need not have a second copy in GitHub.
          # Verify the actual deployed binding; all live response gates below remain required.
          npx wrangler secret list --format json | node scripts/verify-provider-configuration.mjs
      - name: Browser CORS preflight smoke test
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pi-chat.premchandyadlapati.workers.dev/api/chat'
          status="$(curl --silent --show-error --location --max-time 15 -X OPTIONS \
            -H 'origin: https://pisolutions9.github.io' \
            -H 'access-control-request-method: POST' \
            -H 'access-control-request-headers: content-type' \
            --output /tmp/pi-preflight.json --write-out '%{http_code}' "$endpoint")"
          test "$status" = 204
          test "$(curl --silent --show-error --location --max-time 15 -I -X OPTIONS \
            -H 'origin: https://pisolutions9.github.io' \
            -H 'access-control-request-method: POST' \
            -H 'access-control-request-headers: content-type' "$endpoint" | tr -d '\r' | grep -i '^access-control-allow-origin:' | sed 's/^[^:]*: //' | xargs)" = 'https://pisolutions9.github.io'
      - name: Cross-device session sync smoke test
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pi-chat.premchandyadlapati.workers.dev/api/session'
          token='AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          save_status="$(curl --silent --show-error --location --max-time 15 \
            -H 'content-type: application/json' \
            -H 'origin: https://pisolutions9.github.io' \
            -d "{\"action\":\"save\",\"token\":\"$token\",\"conversation\":[{\"role\":\"user\",\"content\":\"sync-smoke\"}],\"draft\":\"next\"}" \
            --output /tmp/pi-session-save.json --write-out '%{http_code}' "$endpoint")"
          test "$save_status" = 200
          python -c 'import json; d=json.load(open("/tmp/pi-session-save.json")); assert d.get("ok") is True'
          load_status="$(curl --silent --show-error --location --max-time 15 \
            -H 'content-type: application/json' \
            -H 'origin: https://pisolutions9.github.io' \
            -d "{\"action\":\"load\",\"token\":\"$token\"}" \
            --output /tmp/pi-session-load.json --write-out '%{http_code}' "$endpoint")"
          test "$load_status" = 200
          python -c 'import json; d=json.load(open("/tmp/pi-session-load.json")); s=d.get("session") or {}; assert s.get("draft")=="next"; assert s.get("conversation")==[{"role":"user","content":"sync-smoke"}]'
          clear_status="$(curl --silent --show-error --location --max-time 15 \
            -H 'content-type: application/json' \
            -H 'origin: https://pisolutions9.github.io' \
            -d "{\"action\":\"clear\",\"token\":\"$token\"}" \
            --output /tmp/pi-session-clear.json --write-out '%{http_code}' "$endpoint")"
          test "$clear_status" = 200

      - name: Live customer chat smoke test
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pi-chat.premchandyadlapati.workers.dev/api/chat'
          answers=()
          live_model_answers=0
          questions=(
            'What is 2 plus 2?'
            'Why is the sky blue?'
            'Say hello in one short sentence.'
            'Give me one unusual fact about Saturn in one sentence.'
            'Explain opportunity cost in simple terms.'
            'What is the difference between RAM and storage?'
            'Give me three practical ways to reduce household food waste.'
            'Explain photosynthesis to a 10-year-old.'
            'What makes a good business hypothesis?'
            'Give me a one-sentence explanation of compound interest.'
            'Build me a website for launching my own products like Amazon.'
          )
          for question in "${questions[@]}"; do
            status="$(curl --silent --show-error --location --max-time 20 --retry 2 --retry-all-errors \
              -H 'content-type: application/json' \
              -H 'origin: https://pisolutions9.github.io' \
              -d "$(python -c 'import json,sys; print(json.dumps({"message":sys.argv[1]}))' "$question")" \
              --output /tmp/pi-chat.json --write-out '%{http_code}' "$endpoint")"
            echo "Chat HTTP status: $status | input: $question"
            cat /tmp/pi-chat.json
            test "$status" = 200
            python -c 'import json; d=json.load(open("/tmp/pi-chat.json")); assert d.get("ok") is True and isinstance(d.get("answer"), str) and d["answer"].strip(); a=d["answer"].lower(); forbidden=("classification:","i recognized this as an informational question","i will answer directly when the required knowledge is available.","temporarily operating in verified recovery mode"); assert not any(x in a for x in forbidden)'
            source="$(python -c 'import json; print(json.load(open("/tmp/pi-chat.json")).get("source", ""))')"
            if [[ "$source" != pi-chat-deterministic-recovery ]]; then live_model_answers=$((live_model_answers + 1)); fi
            answers+=("$(python -c 'import json; print(json.load(open("/tmp/pi-chat.json"))["answer"])')")
          done
          test "${#answers[@]}" = 11
          for ((i=0; i<${#answers[@]}; i++)); do test -n "${answers[$i]}"; done
          echo "Live model-backed answers: $live_model_answers"
          # Release readiness requires the great majority of the customer smoke
          # to be genuinely model-backed, not deterministic recovery.
          test "$live_model_answers" -ge 9
      - name: Canonical customer page release smoke
        shell: bash
        run: |
          set -euo pipefail
          page='https://pisolutions9.github.io/Pisolutions9/'
          expected="$(grep -o 'data-pi-release="[^"]*"' "$GITHUB_WORKSPACE/index.html" | head -1)"
          test -n "$expected"
          echo "Expected release marker: $expected"
          for attempt in {1..18}; do
            body="$(curl --silent --show-error --location --max-time 15 "$page" || true)"
            if grep -Fq "$expected" <<<"$body"; then
              echo 'Canonical customer page is serving the exact checked-out V1.02 release marker.'
              exit 0
            fi
            sleep 10
          done
          echo "Canonical customer page did not expose $expected." >&2
          exit 1

      - name: Live-data truth boundary smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pi-chat.premchandyadlapati.workers.dev/api/chat'
          status="$(curl --silent --show-error --location --max-time 25 --retry 1 --retry-all-errors \
            -H 'content-type: application/json' \
            -H 'origin: https://pisolutions9.github.io' \
            -d '{"message":"What is the weather today in Mobile, Alabama?"}' \
            --output /tmp/pi-live-data.json --write-out '%{http_code}' "$endpoint")"
          cat /tmp/pi-live-data.json
          test "$status" = 200
          python -c 'import json; d=json.load(open("/tmp/pi-live-data.json")); assert d.get("ok") is True; assert d.get("truth") in ("web-grounded-model-response","live-data-response"); assert isinstance(d.get("sources"),list) and len(d["sources"])>0; assert isinstance(d.get("answer"),str) and d["answer"].strip(); assert str(d.get("source","")).startswith(("pi-chat-web","pi-weather-"))'

      - name: Shopping result link smoke test
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pi-chat.premchandyadlapati.workers.dev/api/chat'
          status="$(curl --silent --show-error --location --max-time 30 --retry 1 --retry-all-errors \
            -H 'content-type: application/json' \
            -H 'origin: https://pisolutions9.github.io' \
            -d '{"message":"Find me a stainless steel water bottle currently available on Amazon and give me the product link."}' \
            --output /tmp/pi-shopping.json --write-out '%{http_code}' "$endpoint")"
          cat /tmp/pi-shopping.json
          test "$status" = 200
          python - <<'PY'
          import json
          d=json.load(open('/tmp/pi-shopping.json'))
          assert d.get('ok') is True
          assert d.get('truth') in ('web-grounded-model-response','live-data-response','retailer-search-link')
          sources=d.get('sources')
          assert isinstance(sources,list) and sources
          assert any(isinstance(s,dict) and isinstance(s.get('url'),str) and s['url'].startswith('https://') for s in sources)
          assert isinstance(d.get('answer'),str) and d['answer'].strip()
          PY

      - name: Verified live shopping connector certification
        if: ${{ env.SERPAPI_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pi-chat.premchandyadlapati.workers.dev/api/chat'
          status="$(curl --silent --show-error --location --max-time 30 --retry 1 --retry-all-errors \
            -H 'content-type: application/json' \
            -H 'origin: https://pisolutions9.github.io' \
            -d '{"message":"Find me a stainless steel water bottle currently available on Amazon and give me the product link."}' \
            --output /tmp/pi-shopping-verified.json --write-out '%{http_code}' "$endpoint")"
          cat /tmp/pi-shopping-verified.json
          test "$status" = 200
          python - <<'PY'
          import json
          d=json.load(open('/tmp/pi-shopping-verified.json'))
          assert d.get('ok') is True
          assert d.get('truth') == 'live-data-response'
          assert d.get('source') == 'pi-shopping-serpapi'
          sources=d.get('sources')
          assert isinstance(sources,list) and sources
          assert any('amazon.com' in str(s.get('url','')) for s in sources if isinstance(s,dict))
          PY

      - name: Record certified production evidence
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body "PI V1.02 PRODUCTION GATES GREEN — commit $GITHUB_SHA passed Worker deployment, provider configuration, CORS, cross-device sync, canonical frontend marker, >=9/11 model-backed customer smoke answers, web-grounded live-data research with sources and a result-first shopping link; verified live retailer availability is additionally certified when SERPAPI_API_KEY is configured." || echo 'Evidence comment skipped because repository issues are unavailable.'

      - name: Record production gate failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 16 --repo "$GITHUB_REPOSITORY" --body "PI V1.02 PRODUCTION GATE FAILED — commit $GITHUB_SHA, run $GITHUB_RUN_ID. Inspect this exact run; diagnose and fix the failed gate without weakening the release standard." || echo 'Failure evidence comment skipped because repository issues are unavailable.'
