name: PI Chat Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/pi-chat-worker.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install current Wrangler
        working-directory: worker
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Test deterministic recovery
        working-directory: worker
        run: node src/deterministic-fallback-test.mjs
      - name: Deploy PI chat worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Configure optional OpenAI fallback
        if: ${{ env.OPENAI_API_KEY != '' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
          echo 'OpenAI fallback secret configured on the production Worker.'
      - name: Verify provider configuration path
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$OPENAI_API_KEY" ]]; then
            echo 'Provider path: Cloudflare AI primary + OpenAI fallback configured.'
          else
            echo 'Provider path: Cloudflare AI primary; OpenAI fallback not configured.'
          fi
      - name: Browser CORS preflight smoke test
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pi-chat.premchandyadlapati.workers.dev/api/chat'
          status="$(curl --silent --show-error --location --max-time 15 -X OPTIONS \
            -H 'origin: https://pisolutions9.github.io' \
            -H 'access-control-request-method: POST' \
            -H 'access-control-request-headers: content-type' \
            --output /tmp/pi-preflight.json --write-out '%{http_code}' "$endpoint")"
          test "$status" = 204
          test "$(curl --silent --show-error --location --max-time 15 -I -X OPTIONS \
            -H 'origin: https://pisolutions9.github.io' \
            -H 'access-control-request-method: POST' \
            -H 'access-control-request-headers: content-type' "$endpoint" | tr -d '\r' | grep -i '^access-control-allow-origin:' | sed 's/^[^:]*: //' | xargs)" = 'https://pisolutions9.github.io'
      - name: Live customer chat smoke test
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pi-chat.premchandyadlapati.workers.dev/api/chat'
          answers=()
          live_model_answers=0
          questions=(
            'What is 2 plus 2?'
            'Why is the sky blue?'
            'Say hello in one short sentence.'
            'Give me one unusual fact about Saturn in one sentence.'
            'Explain opportunity cost in simple terms.'
            'What is the difference between RAM and storage?'
            'Give me three practical ways to reduce household food waste.'
            'Explain photosynthesis to a 10-year-old.'
            'What makes a good business hypothesis?'
            'Give me a one-sentence explanation of compound interest.'
            'Build me a website for launching my own products like Amazon.'
          )
          for question in "${questions[@]}"; do
            status="$(curl --silent --show-error --location --max-time 20 --retry 2 --retry-all-errors \
              -H 'content-type: application/json' \
              -H 'origin: https://pisolutions9.github.io' \
              -d "$(python -c 'import json,sys; print(json.dumps({"message":sys.argv[1]}))' "$question")" \
              --output /tmp/pi-chat.json --write-out '%{http_code}' "$endpoint")"
            echo "Chat HTTP status: $status | input: $question"
            cat /tmp/pi-chat.json
            test "$status" = 200
            python -c 'import json; d=json.load(open("/tmp/pi-chat.json")); assert d.get("ok") is True and isinstance(d.get("answer"), str) and d["answer"].strip(); a=d["answer"].lower(); forbidden=("classification:","i recognized this as an informational question","i will answer directly when the required knowledge is available.","temporarily operating in verified recovery mode"); assert not any(x in a for x in forbidden)'
            source="$(python -c 'import json; print(json.load(open("/tmp/pi-chat.json")).get("source", ""))')"
            if [[ "$source" != pi-chat-deterministic-recovery ]]; then live_model_answers=$((live_model_answers + 1)); fi
            answers+=("$(python -c 'import json; print(json.load(open("/tmp/pi-chat.json"))["answer"])')")
          done
          test "${#answers[@]}" = 11
          for ((i=0; i<${#answers[@]}; i++)); do test -n "${answers[$i]}"; done
          echo "Live model-backed answers: $live_model_answers"
          test "$live_model_answers" -ge 1
      - name: Live-data truth boundary smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://pi-chat.premchandyadlapati.workers.dev/api/chat'
          status="$(curl --silent --show-error --location --max-time 25 --retry 1 --retry-all-errors \
            -H 'content-type: application/json' \
            -H 'origin: https://pisolutions9.github.io' \
            -d '{"message":"What is the weather today in Mobile, Alabama?"}' \
            --output /tmp/pi-live-data.json --write-out '%{http_code}' "$endpoint")"
          cat /tmp/pi-live-data.json
          if [[ "$status" = 200 ]]; then
            python -c 'import json; d=json.load(open("/tmp/pi-live-data.json")); assert d.get("ok") is True; assert d.get("truth")=="web-grounded-model-response"; assert isinstance(d.get("sources"),list) and len(d["sources"])>0; assert isinstance(d.get("answer"),str) and d["answer"].strip()'
          else
            test "$status" = 503
            python -c 'import json; d=json.load(open("/tmp/pi-live-data.json")); assert d.get("ok") is False; assert d.get("truth")=="unknown"; assert d.get("error") in ("live_data_connector_not_configured","live_research_unverified","live_research_provider_unavailable")'
          fi
