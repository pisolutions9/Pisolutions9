name: PI V1.02 PR Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pi-v102-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed V1.02 change
        uses: actions/checkout@v5
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete V1.02 release gate
        run: npm run test:release:v1.02
