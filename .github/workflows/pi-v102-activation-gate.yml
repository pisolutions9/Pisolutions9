name: PI V1.02 Activation Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-v102-activation
  cancel-in-progress: true

env:
  PI_CHAT_URL: https://pi-chat.premchandyadlapati.workers.dev
  PI_PUBLIC_URL: https://pisolutions9.github.io/Pisolutions9

jobs:
  activation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify V1.02 code release suite
        run: npm run test:release:v1.02
      - name: Verify live owner authentication is configured
        env:
          PI_OWNER_TOKEN: ${{ secrets.PI_OWNER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PI_OWNER_TOKEN:-}" ]]; then
            echo 'PI_OWNER_TOKEN is not configured in GitHub Actions secrets.' >&2
            exit 1
          fi

          http_code="$(curl --silent --show-error --max-time 20 -o /tmp/pi-owner-login-invalid.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'origin: https://pisolutions9.github.io' \
            -d '{"secret":"__pi_activation_probe_invalid_secret__"}' \
            "$PI_CHAT_URL/api/owner/login")"
          python - <<'PY' "$http_code" "$(cat /tmp/pi-owner-login-invalid.json)"
          import json,sys
          code=int(sys.argv[1])
          d=json.loads(sys.argv[2])
          assert code == 401, f"expected configured owner auth to reject invalid secret with 401, got {code}: {d}"
          assert d.get("error") == "unauthorized", f"unexpected owner auth probe response: {d}"
          PY

          dashboard_code="$(curl --silent --show-error --max-time 20 -o /tmp/pi-owner-dashboard.json -w '%{http_code}' \
            -H 'origin: https://pisolutions9.github.io' \
            "$PI_CHAT_URL/api/owner/dashboard")"
          python - <<'PY' "$dashboard_code" "$(cat /tmp/pi-owner-dashboard.json)"
          import json,sys
          code=int(sys.argv[1])
          d=json.loads(sys.argv[2])
          assert code == 401, f"owner dashboard must fail closed without a session, got {code}: {d}"
          assert d.get("error") == "owner_session_invalid", f"unexpected owner dashboard response: {d}"
          PY

          login_payload="$(python -c 'import json,os; print(json.dumps({"secret":os.environ["PI_OWNER_TOKEN"]}))')"
          login_code="$(curl --silent --show-error --max-time 20 -o /tmp/pi-owner-login.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'origin: https://pisolutions9.github.io' \
            -d "$login_payload" \
            "$PI_CHAT_URL/api/owner/login")"
          session_token="$(python - <<'PY' "$login_code" "$(cat /tmp/pi-owner-login.json)"
          import json,sys
          code=int(sys.argv[1])
          d=json.loads(sys.argv[2])
          assert code == 200, f"owner login failed with {code}: {d}"
          assert d.get('ok') is True and d.get('authenticated') is True
          token=d.get('sessionToken')
          assert isinstance(token,str) and len(token)==43
          assert d.get('expiresAt'), 'owner session expiry missing'
          print(token)
          PY
          )"
          echo "::add-mask::$session_token"

          status_code="$(curl --silent --show-error --max-time 20 -o /tmp/pi-owner-status.json -w '%{http_code}' \
            -H 'origin: https://pisolutions9.github.io' \
            -H "authorization: Bearer $session_token" \
            "$PI_CHAT_URL/api/owner/status")"
          python - <<'PY' "$status_code" "$(cat /tmp/pi-owner-status.json)"
          import json,sys
          code=int(sys.argv[1])
          d=json.loads(sys.argv[2])
          assert code == 200, f"owner status failed with {code}: {d}"
          assert d.get('ok') is True and d.get('authenticated') is True
          assert d.get('ownerId') == 'primary-owner'
          PY

          logout_code="$(curl --silent --show-error --max-time 20 -o /tmp/pi-owner-logout.json -w '%{http_code}' \
            -X POST \
            -H 'origin: https://pisolutions9.github.io' \
            -H "authorization: Bearer $session_token" \
            "$PI_CHAT_URL/api/owner/logout")"
          python - <<'PY' "$logout_code" "$(cat /tmp/pi-owner-logout.json)"
          import json,sys
          code=int(sys.argv[1])
          d=json.loads(sys.argv[2])
          assert code == 200 and d.get('ok') is True, f"owner logout failed with {code}: {d}"
          PY

          revoked_code="$(curl --silent --show-error --max-time 20 -o /tmp/pi-owner-revoked.json -w '%{http_code}' \
            -H 'origin: https://pisolutions9.github.io' \
            -H "authorization: Bearer $session_token" \
            "$PI_CHAT_URL/api/owner/status")"
          python - <<'PY' "$revoked_code" "$(cat /tmp/pi-owner-revoked.json)"
          import json,sys
          code=int(sys.argv[1])
          d=json.loads(sys.argv[2])
          assert code == 401, f"revoked owner session remained usable: {code}: {d}"
          assert d.get('error') == 'owner_session_invalid'
          PY
      - name: Require live Stripe configuration and checkout creation
        env:
          PI_STRIPE_SECRET_KEY: ${{ secrets.PI_STRIPE_SECRET_KEY }}
          PI_STRIPE_WEBHOOK_SECRET: ${{ secrets.PI_STRIPE_WEBHOOK_SECRET }}
          PI_STRIPE_PRICE_ID: ${{ secrets.PI_STRIPE_PRICE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in PI_STRIPE_SECRET_KEY PI_STRIPE_WEBHOOK_SECRET PI_STRIPE_PRICE_ID; do
            if [[ -z "${!name:-}" ]]; then echo "$name is not configured in GitHub Actions secrets." >&2; exit 1; fi
          done
          config="$(curl --silent --show-error --max-time 20 -H 'origin: https://pisolutions9.github.io' "$PI_CHAT_URL/api/billing/config")"
          python - <<'PY' "$config"
          import json,sys
          d=json.loads(sys.argv[1])
          assert d.get('billingReady') is True, f"billing is not configured: {d}"
          assert d.get('billingMode') == 'live', f"activation gate requires live Stripe mode, got {d.get('billingMode')!r}"
          assert d.get('liveBillingReady') is True, f"live billing is not ready: {d}"
          assert d.get('checkoutConfigured') is True and d.get('webhookConfigured') is True, f"Stripe checkout/webhook configuration incomplete: {d}"
          PY
          checkout="$(curl --silent --show-error --max-time 25 -H 'content-type: application/json' -H 'origin: https://pisolutions9.github.io' -d '{}' "$PI_CHAT_URL/api/billing/start")"
          python - <<'PY' "$checkout"
          import json,sys
          d=json.loads(sys.argv[1])
          assert d.get('ok') is True
          assert isinstance(d.get('checkoutUrl'),str) and d['checkoutUrl'].startswith('https://checkout.stripe.com/')
          assert isinstance(d.get('customerToken'),str) and len(d['customerToken'])==43
          PY
      - name: Verify exact customer release marker
        shell: bash
        run: |
          set -euo pipefail
          expected="$(grep -o 'data-pi-release="[^"]*"' index.html | head -1)"
          body="$(curl --silent --show-error --location --max-time 20 "$PI_PUBLIC_URL/?candidate=$GITHUB_SHA")"
          grep -Fq "$expected" <<<"$body"
      - name: Activation boundary
        run: |
          echo 'Owner login, authenticated status, logout, revocation, and live Stripe checkout configuration are verified.'
          echo 'Customer charging remains disabled until a real signed-webhook -> persisted-entitlement -> customer-access transaction smoke plus duplicate/failure-path evidence is complete.'
