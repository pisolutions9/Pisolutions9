[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Customer chat is intentionally NOT routed through Netlify.
# The authoritative customer AI runtime is the Cloudflare Worker used by app.js
# and the live release gates. /api/pi remains the distinct owner/cloud runtime.

[[redirects]]
  from = "/api/pi"
  to = "/.netlify/functions/pi"
  status = 200

[[headers]]
  for = "/api/pi"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store"
