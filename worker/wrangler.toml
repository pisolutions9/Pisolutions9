name = "pi-chat"
main = "src/index.js"
compatibility_date = "2026-09-16"

[vars]
PI_CHAT_MODEL = "gpt-5.6-luna"
PI_EDGE_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "PI_SESSION"
class_name = "PISessionStore"

[exports.PISessionStore]
type = "durable-object"
storage = "sqlite"
