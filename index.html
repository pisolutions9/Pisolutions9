<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PI — Think. Plan. Execute. With You." />
  <title>PI — Assistant</title>
  <link rel="stylesheet" href="styles.css?v=20260919-console" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="PI home"><span class="mark">π</span><span><strong>PI</strong><small>Think. Plan. Execute. With You.</small></span></a>
      <div class="status"><span class="dot"></span><span id="systemStatus">Online</span></div>
    </header>

    <section class="workspace" aria-label="PI conversation">
      <div id="welcome" class="welcome">
        <div class="hero-mark">π</div>
        <h1>How can I help?</h1>
        <p>Ask anything. PI keeps the work focused and the answer clear.</p>
      </div>

      <div class="conversation">
        <div id="transcript" role="log" aria-live="polite"></div>
        <section id="mission" class="mission hidden" aria-live="polite">
          <div class="mission-head"><div><p class="eyebrow">PI</p><h2 id="missionTitle"></h2></div><span id="confidence">Ready</span></div>
          <div id="steps" class="steps"></div>
        </section>
      </div>
    </section>

    <section class="composer-wrap" aria-label="Ask PI">
      <div class="composer">
        <button id="clearChat" class="icon-button" type="button" title="New conversation" aria-label="New conversation">＋</button>
        <textarea aria-label="Message to PI" maxlength="8000" id="command" placeholder="Ask me anything…" rows="1"></textarea>
        <button id="run" class="run" aria-label="Send">➜</button>
      </div>
      <div class="suggestions">
        <button data-command="Explain opportunity cost with a simple example.">Explain something</button>
        <button data-command="Create an inventory CSV from these rows:&#10;pens,12,15.00&#10;notebooks,8,45.00">Create a file</button>
        <button data-command="Help me build a clear business plan.">Build a plan</button>
      </div>
      <p class="motto">BIG IDEAS. REAL RESULTS.</p>
    </section>
    <input id="ownerToken" type="hidden" value="" />
  </main>
  <script src="app.js?v=20260919-completion"></script>
</body>
</html>
